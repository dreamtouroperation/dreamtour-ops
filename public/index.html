<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="dt-hosted" content="1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1D2940">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Cpath d=%22M32 4C18 4 12 15 12 24c0 10 9 18 15 24l1 6h8l1-6c6-6 15-14 15-24 0-9-6-20-20-20z%22 fill=%22%2324406E%22/%3E%3Crect x=%2226%22 y=%2255%22 width=%2212%22 height=%228%22 rx=%222%22 fill=%22%239E7230%22/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Dream Tour</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one narrow travel-companion column (phone first) under a dawn-sky band with balloons; admin uses a wider working column. */
:root{
  --bg:#F3ECE1; --paper:#FCF9F4; --sand:#E8D8BE; --line:#DCCDB5;
  --ink:#1D2940; --ink2:#5E6676; --gold:#9E7230; --gold-soft:#F0E0BF;
  --balloon:#C0463A; --ok:#2E7656; --ok-soft:#DCEDE3; --warn:#9A5B10; --warn-soft:#F6E5CC;
  --sky1:#F1C49D; --sky2:#EFD9BF; --sky3:#BCD0DE; --sky-ink:#1D2940;
  --display:"Forum","Cormorant Garamond",Georgia,serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; --shadow:0 1px 0 rgba(29,41,64,.04),0 10px 30px -18px rgba(29,41,64,.35);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1522; --paper:#162033; --sand:#22304A; --line:#2A3852;
  --ink:#F0E7D7; --ink2:#A6AEBC; --gold:#D9B26C; --gold-soft:#3A3223;
  --balloon:#E2695B; --ok:#6CC59B; --ok-soft:#173528; --warn:#E7AE5E; --warn-soft:#3A2A14;
  --sky1:#1A2440; --sky2:#3B3553; --sky3:#B9805E; --sky-ink:#F4EADA; color-scheme:dark;
  --shadow:0 10px 30px -18px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --bg:#0E1522; --paper:#162033; --sand:#22304A; --line:#2A3852;
  --ink:#F0E7D7; --ink2:#A6AEBC; --gold:#D9B26C; --gold-soft:#3A3223;
  --balloon:#E2695B; --ok:#6CC59B; --ok-soft:#173528; --warn:#E7AE5E; --warn-soft:#3A2A14;
  --sky1:#1A2440; --sky2:#3B3553; --sky3:#B9805E; --sky-ink:#F4EADA; color-scheme:dark;
  --shadow:0 10px 30px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.wide{max-width:1120px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.muted{color:var(--ink2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* sky band */
.sky{position:relative;overflow:hidden;color:var(--sky-ink);background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%)}
.sky .wrap{position:relative;z-index:1;padding-block:22px 30px}
.sky svg.balloons{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.ridge{position:absolute;left:0;right:0;bottom:-1px;height:46px;z-index:0}
.ridge path{fill:var(--bg)}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.02em}
.brand span{font-size:10px;letter-spacing:.42em;text-transform:uppercase;font-weight:700;opacity:.75}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}
.link{background:none;border:0;padding:6px 0;color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px;opacity:.85}
.hero-title{font-size:clamp(30px,8vw,42px);line-height:1.05;margin-top:56px;padding-right:52px}
.hero-sub{margin:10px 0 0;max-width:34ch;opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:color-mix(in srgb,var(--paper) 70%,transparent);border:1px solid color-mix(in srgb,var(--sky-ink) 14%,transparent);font-size:12.5px;font-weight:600}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.float{animation:drift 9s ease-in-out infinite}
.float.b{animation-duration:12s;animation-delay:-4s}.float.c{animation-duration:15s;animation-delay:-7s}
@media (prefers-reduced-motion:reduce){.float{animation:none}}

/* cards & forms */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.pagebody{padding-block:6px 48px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}
.input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px;outline:none}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 22%,transparent)}
.input.code{letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:12px;border:1px solid transparent;background:var(--ink);color:var(--bg);font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible,.tab:focus-visible,.who:focus-visible,.link:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.gold{background:var(--gold);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default}
.err{color:var(--balloon);font-size:13.5px;font-weight:600}
.hint{font-size:13px;color:var(--ink2)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px}
.tabs .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--sand)}
.tab{border:0;background:transparent;padding:10px 6px;border-radius:10px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--ink2)}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}

/* who am I */
.whos{display:flex;flex-direction:column;max-height:340px;overflow:auto;margin-top:10px;border-top:1px solid var(--line)}
.who{display:flex;justify-content:space-between;gap:10px;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 4px;cursor:pointer;font-weight:600}
.who small{color:var(--ink2);font-weight:500}
.hello{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hello h2{font-size:26px}

/* today */
.today{background:linear-gradient(160deg,var(--gold-soft),var(--paper) 70%);border-color:color-mix(in srgb,var(--gold) 35%,var(--line))}
.today h3{font-size:28px;line-height:1.1;margin-top:6px}
.today p{margin:8px 0 0}
.daycount{font-family:var(--display);font-size:15px;color:var(--ink2)}
.pkg{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tag{padding:6px 12px;border-radius:999px;background:var(--sand);font-size:13px;font-weight:600}
.tag.gold{background:var(--gold);color:#fff}
.infos{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.infos li{padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--ink);font-size:14px}
.bday{background:linear-gradient(120deg,var(--balloon),color-mix(in srgb,var(--balloon) 55%,var(--gold)));color:#fff;border:0}
.bday h3{font-size:26px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.phone{font-weight:800;font-size:18px;user-select:all}

/* route timeline */
.route{list-style:none;margin:0;padding:0;position:relative}
.route li{display:grid;grid-template-columns:62px 1fr;gap:14px;padding:0 0 22px;position:relative}
.route li::before{content:"";position:absolute;left:30px;top:30px;bottom:0;width:1px;background:var(--line)}
.route li:last-child::before{display:none}
.dnum{width:62px;text-align:center}
.dnum .d{display:block;font-family:var(--display);font-size:28px;line-height:1}
.dnum .m{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink2);font-weight:700}
.route .body{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.route .body h3{font-size:21px;margin-top:2px}
.route .body p{margin:6px 0 0;color:var(--ink2);font-size:14px}
.route li.past .body{opacity:.6}
.route li.now .body{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 20%,transparent)}
.route li.now .dnum .d{color:var(--gold)}
.badge{display:inline-block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--gold);color:#fff;margin-left:6px;vertical-align:middle}

/* transfers */
.big{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-top:6px}
.big .t{font-family:var(--display);font-size:64px;line-height:.9}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:14px}
.kv div{background:var(--bg);border-radius:12px;padding:10px 12px}
.kv dt{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.kv dd{margin:2px 0 0;font-weight:700}
.slots{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.slot{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--paper)}
.slot .st{font-family:var(--display);font-size:26px}
.slot small{display:block;color:var(--ink2);font-size:12.5px}
.slot.mine{border-color:var(--gold);background:linear-gradient(90deg,var(--gold-soft),var(--paper))}
.pill{font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill.mine{background:var(--gold);color:#fff}.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.no{background:var(--sand);color:var(--ink2)}
.empty{text-align:center;padding:26px 18px}
.empty h3{font-size:22px}

.foot{padding-block:24px 36px;text-align:center;font-size:12.5px;color:var(--ink2)}
.previewbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600}
.previewbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:8px}
.previewbar .btn{background:var(--bg);color:var(--ink)}

/* admin */
.atop{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--paper);border-bottom:1px solid var(--line)}
.atop .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:12px}
.dirty{font-size:12.5px;font-weight:700;color:var(--warn);background:var(--warn-soft);padding:4px 10px;border-radius:999px}
.agrid{display:grid;grid-template-columns:1fr;gap:16px;padding-block:18px 60px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h2{font-size:24px;margin-bottom:4px}
.panel>.hint{margin:0 0 14px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fields .input,.tbl .input{font-size:14px;padding:9px 11px;border-radius:10px}
.tourtabs{display:flex;gap:6px;flex-wrap:wrap}
.tourtabs .btn{font-size:13px}
.tourtabs .btn[aria-pressed="true"]{background:var(--gold);color:#fff}
.tblwrap{overflow-x:auto;margin-top:8px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);text-align:left;font-weight:700;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.nw{white-space:nowrap}
.note{font-size:12.5px;color:var(--ink2);max-width:320px;white-space:pre-line}
.uploads{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.drop{display:flex;flex-direction:column;gap:6px;border:1.5px dashed var(--line);border-radius:14px;padding:16px;cursor:pointer;background:var(--bg)}
.drop:hover,.drop:focus-within{border-color:var(--gold)}
.drop b{font-size:15px}
.drop input{font-size:13px}
.msg{font-size:13.5px;padding:10px 12px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-weight:600;margin-top:10px}
.msg.bad{background:var(--warn-soft);color:var(--warn)}
.daygrid{display:grid;grid-template-columns:90px 1fr 1fr 2fr auto;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
@media (max-width:760px){.daygrid{grid-template-columns:1fr 1fr}.daygrid .wide2{grid-column:1/-1}}
.private{font-size:11px;font-weight:800;color:var(--balloon);letter-spacing:.06em;text-transform:uppercase}

/* ops console & guide cabinet */
.seg.two{grid-template-columns:repeat(2,1fr)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.day{flex:none;display:flex;flex-direction:column;align-items:center;min-width:56px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--ink2);cursor:pointer}
.day b{font-family:var(--display);font-size:24px;font-weight:400;color:var(--ink);letter-spacing:0;line-height:1.1}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}.day[aria-pressed="true"] b{color:var(--bg)}
.kind{display:inline-block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;padding:4px 9px;border-radius:999px}
.kind.arr{background:var(--ok-soft);color:var(--ok)}.kind.dep{background:var(--gold-soft);color:var(--gold)}
.donecnt{font-family:var(--display);font-size:30px;color:var(--ink2)}.donecnt.all{color:var(--ok)}
.fls{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.fls .chip{background:var(--bg);border-color:var(--line)}
.chip.bad{background:var(--warn-soft);color:var(--balloon);border-color:transparent}
.linkbtn{background:none;border:0;padding:0;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.plist{list-style:none;margin:12px 0 0;padding:0;border-top:1px solid var(--line)}
.plist li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-weight:600}
.plist li small{color:var(--ink2);font-weight:500}
.plist li .g{margin-left:auto;font-size:12px}
.mark{flex:none;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);color:transparent;font-weight:800;cursor:pointer}
.mark[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.tlist{margin-top:12px;border-top:1px solid var(--line)}
.trow{padding:12px 0;border-bottom:1px solid var(--line)}
.snote{margin:8px 0 0;font-size:13px;color:var(--ink2)}
.abar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:12px 8px}
.aright{margin-left:auto}
.daysel{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.daysel button{border:0;background:var(--paper);padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink2)}
.daysel button+button{border-left:1px solid var(--line)}
.daysel button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.atabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.atab{border:0;background:none;padding:10px 14px;font-weight:700;font-size:13.5px;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.atab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.atab .cnt{font-size:11px;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--sand);color:var(--ink)}
.atab .cnt.bad{background:var(--warn-soft);color:var(--balloon)}
.atop .wrap{display:block;padding-block:0}
.apage{display:flex;flex-direction:column;gap:14px;padding-block:18px 60px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stat{background:var(--paper);padding:12px 14px;box-shadow:0 0 0 .5px var(--line)}
.stat .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.stat .v{font-family:var(--display);font-size:32px;line-height:1.1}
.stat .s{font-size:12px;color:var(--ink2)}
.stat.bad .v{color:var(--balloon)}.stat.warn .v{color:var(--warn)}.stat.good .v{color:var(--ok)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters .input{width:auto;flex:1 1 220px;font-size:14px;padding:9px 12px}
.board{display:grid;gap:10px}
.run{display:grid;grid-template-columns:118px minmax(0,1fr) 300px;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.run.nog{border-left:4px solid var(--balloon)}
.run .rt{padding:12px;background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.run .tt{font-family:var(--display);font-size:34px;line-height:1}
.run .rk{font-size:12px;color:var(--ink2)}
.run .veh{margin-top:8px;font-weight:800}
.run .rm{padding:10px 14px;min-width:0}
.run .rm .fls{margin-top:0}
.names{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px}
.names small{color:var(--ink2)}.names em{font-style:normal;font-size:11.5px;color:var(--gold);font-weight:700}
.run .rs{padding:10px 12px;border-left:1px solid var(--line);display:grid;gap:8px;align-content:start}
.run .rs label,.sidebox label{display:grid;gap:3px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.run .rs .input{font-size:13.5px;padding:7px 10px;border-radius:9px;text-transform:none;letter-spacing:0}
.run .rs .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.03em}
.ah{font-family:var(--display);font-size:24px;font-weight:400}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:16px;align-items:start}
.sidebox{display:grid;gap:10px;position:sticky;top:130px}
.msgbox{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;white-space:pre-wrap;font-size:12.5px;max-height:520px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace}
.warnt{color:var(--warn);font-weight:700}.badt{color:var(--balloon);font-weight:700}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.addrow .input{width:auto;flex:1 1 200px;font-size:14px;padding:9px 12px}
.checks{display:grid;gap:8px}
.chk{display:grid;grid-template-columns:6px minmax(0,1fr);text-align:left;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper);padding:0;cursor:pointer}
.chk .bar{background:var(--warn)}.chk.crit .bar{background:var(--balloon)}.chk.info .bar{background:var(--line)}
.chk .body{display:grid;gap:2px;padding:10px 14px}
.chk .sev{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--warn)}
.chk.crit .sev{color:var(--balloon)}.chk.info .sev{color:var(--ink2)}
.chk .det{font-size:13px;color:var(--ink2)}
.panel.empty{text-align:center}
@media (max-width:860px){

/* arrivals board */
.flight{display:grid;grid-template-columns:96px minmax(0,1fr) 230px;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}

.fmid{padding:10px 14px;min-width:0;display:grid;gap:6px;align-content:start}
.fl-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fl-code{font-family:var(--display);font-size:24px;letter-spacing:.02em}
.grp{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:10px;align-items:center;font-size:13px;padding:6px 0;border-top:1px dashed var(--line)}
.grp .gd{font-size:12.5px;color:var(--ink2)}.grp .gd.no{color:var(--balloon);font-weight:700}
.grp .px{font-weight:800}
.gtoggle{justify-self:start;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink)}
.gtoggle[aria-expanded="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.guests{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:4px}
.guests.flat{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.guest{width:100%;display:grid;grid-template-columns:minmax(0,1.4fr) auto minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 10px;font-size:13px;cursor:pointer}
.guests.flat .guest{grid-template-columns:minmax(0,1fr) auto}
.guest:hover{border-color:var(--gold)}
.guest .gn{font-weight:700;min-width:0}.guest small{color:var(--ink2);font-weight:500}
.guest em{font-style:normal;font-size:11.5px;color:var(--gold);font-weight:800;white-space:nowrap}
.guest .gv,.guest .gg{font-size:12px;color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fside{padding:10px 12px;border-left:1px solid var(--line);display:grid;gap:8px;align-content:start;font-size:13px}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:12px;padding:4px 9px;border-radius:999px;justify-self:start}
.status .dot{width:7px;height:7px;border-radius:50%;background:currentColor}

.card0{background:var(--paper);border:1px solid var(--line);border-radius:14px}

.scrim{position:fixed;inset:0;z-index:30;background:rgba(14,21,34,.38);border:0;padding:0;cursor:default}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:31;width:min(440px,100%);background:var(--paper);border-left:1px solid var(--line);box-shadow:-20px 0 40px -20px rgba(0,0,0,.4);overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px}

}

/* guide marks */
.mtally{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;font-weight:800}
.mtally span{padding:4px 10px;border-radius:999px;background:var(--sand);color:var(--ink2)}
.mtally .ok{background:var(--ok-soft);color:var(--ok)}.mtally .bad{background:var(--warn-soft);color:var(--balloon)}
.plist li{flex-wrap:wrap}
.plist li .pn{flex:1 1 160px;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}

.plist li.m-out .pn{color:var(--ok)}.plist li.m-no .pn{color:var(--balloon)}

.mk{display:inline-block;font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;vertical-align:middle}

  /* Merge a departures upload into state and attach to tourists by name. */

  /* ---------- operations: vehicle runs (arrivals and departures) ---------- */

  function loadPending() { try { MK.pending = JSON.parse(load('dt.pending') || '[]'); } catch (e) { MK.pending = []; } }
  function savePending() { store('dt.pending', MK.pending.length ? JSON.stringify(MK.pending) : null); }
  function markOf(run, pax) {
    var id = DT.markId(run, pax);
    if (!HOSTED) return load('dt.mk.' + id) || '';

  }
  function markInfo(run, pax) { return MK.marks[DT.markId(run, pax)] || null; }
  function setMark(run, pax, s) {
    var id = DT.markId(run, pax), t = new Date().toISOString();
    if (!HOSTED) { store('dt.mk.' + id, s || null); render(); return; }
    MK.marks[id] = { s: s || '', t: t, g: S.view === 'admin' ? 'office' : ((S.payload || {}).guide || {}).id };
    MK.pending = MK.pending.filter(function (x) { return x.id !== id; });
    MK.pending.push({ id: id, s: s || null, t: t });
    savePending(); render(); flushMarks();
  }
  async function flushMarks() {
    if (!HOSTED || !MK.key || !MK.pending.length || (S.view !== 'guide' && S.view !== 'admin')) return;
    var items = MK.pending.slice();
    try {
      var r = await fetch('/api/marks', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ key: MK.key, items: items }) });
      if (!r.ok) throw new Error(r.status);
      MK.pending = MK.pending.filter(function (x) { return items.indexOf(x) < 0; }); savePending(); MK.online = true;
    } catch (e) { MK.online = false; }
    renderSoft();
  }
  async function pullMarks() {
    if (!HOSTED || !MK.key) return;
    try {
      var r = await fetch('/api/marks', { headers: { 'x-dt-key': MK.key }, cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      var m = (await r.json()).marks || {};
      MK.pending.forEach(function (x) { if (x.s) m[x.id] = { s: x.s, t: x.t }; else delete m[x.id]; });
      var changed = JSON.stringify(m) !== JSON.stringify(MK.marks);
      MK.marks = m; MK.online = true;
      if (changed) renderSoft();
    } catch (e) { MK.online = false; }
  }

  }

  async function loadXLSX() {
    if (window.XLSX) return window.XLSX;
    await new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload = res; s.onerror = function () { rej(new Error('Не удалось загрузить модуль Excel')); };

  }
  async function readWb(file) {

  /* ---------- reading any file: Excel, CSV, PDF (text or scan), Word, text, photo ---------- */
  var LIBS = {
    pdf: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
    pdfw: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
    mammoth: 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js',
    ocr: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js'
  };
  function loadScript(src, global) {
    if (window[global]) return Promise.resolve(window[global]);
    return new Promise(function (res, rej) {
      var s = document.createElement('script'); s.src = src;
      s.onload = function () { res(window[global]); }; s.onerror = function () { rej(new Error('Не удалось загрузить модуль для чтения файла. Проверьте интернет.')); };
      document.head.appendChild(s);
    });
  }
  function progress(t) { S.msg = { text: t }; renderSoft(); }

  async function ocrItems(src, page, items) {
    var T = await loadScript(LIBS.ocr, 'Tesseract');
    var r = await T.recognize(src, 'rus+eng', { logger: function (m) { if (m.status === 'recognizing text') progress('Распознаём текст' + (page ? ', страница ' + page : '') + ': ' + Math.round(m.progress * 100) + '%'); } });
    (r.data.words || []).forEach(function (w) { var b = w.bbox; items.push({ s: w.text, x: b.x0, y: (b.y0 + b.y1) / 2, w: b.x1 - b.x0, h: b.y1 - b.y0, page: page || 1 }); });
  }

  async function readAny(file, kind, year) {
    var name = file.name || 'файл', ext = (name.split('.').pop() || '').toLowerCase(), type = file.type || '';
    if (/^(xlsx|xlsm|xls|xlsb|ods|csv|tsv)$/.test(ext) || /sheet|excel|csv/.test(type)) {
      progress('Читаем таблицу…');
      var X = await loadXLSX(), buf = await file.arrayBuffer();
      return { X: X, wb: X.read(buf, { type: 'array' }), how: ext.toUpperCase() };
    }
    var lines, how;
    if (ext === 'pdf' || type === 'application/pdf') {
      progress('Читаем PDF…');
      var pdfjs = await loadScript(LIBS.pdf, 'pdfjsLib');
      pdfjs.GlobalWorkerOptions.workerSrc = LIBS.pdfw;
      var doc = await pdfjs.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise, items = [], chars = 0;
      for (var pg = 1; pg <= doc.numPages; pg++) {
        var page = await doc.getPage(pg), vp = page.getViewport({ scale: 1 }), tc = await page.getTextContent();
        tc.items.forEach(function (it) { if (!it.str || !it.str.trim()) return; chars += it.str.length; items.push({ s: it.str, x: it.transform[4], y: vp.height - it.transform[5], w: it.width, h: it.height || Math.abs(it.transform[3]), page: pg }); });
      }
      how = 'PDF';
      if (chars < 20 * doc.numPages) {
        items = []; how = 'PDF-скан, распознавание текста';
        for (var p2 = 1; p2 <= doc.numPages; p2++) {
          var pp = await doc.getPage(p2), v2 = pp.getViewport({ scale: 2.2 }), cv = document.createElement('canvas');
          cv.width = v2.width; cv.height = v2.height;
          await pp.render({ canvasContext: cv.getContext('2d'), viewport: v2 }).promise;
          await ocrItems(cv, p2, items);
        }
      }
      lines = DT.linesFromItems(items);
    } else if (ext === 'docx' || /wordprocessingml/.test(type)) {
      progress('Читаем документ Word…');
      var mm = await loadScript(LIBS.mammoth, 'mammoth');
      var html = (await mm.convertToHtml({ arrayBuffer: await file.arrayBuffer() })).value;
      var dom = new DOMParser().parseFromString(html, 'text/html');
      lines = [];
      (function walk(el) {
        Array.prototype.forEach.call(el.children, function (c) {
          if (c.tagName === 'TABLE') Array.prototype.forEach.call(c.querySelectorAll('tr'), function (tr) { lines.push(Array.prototype.map.call(tr.children, function (td) { return td.textContent.trim(); })); });
          else if (/^(P|H\d|LI)$/.test(c.tagName)) lines.push(DT.linesFromText(c.textContent)[0] || []);
          else walk(c);
        });
      })(dom.body);
      how = 'Word';
    } else if (/^(txt|text)$/.test(ext) || /^text\//.test(type)) {
      lines = DT.linesFromText(await file.text()); how = 'текст';
    } else if (/^(jpe?g|png|webp|bmp|gif)$/.test(ext) || /^image\/(jpeg|png|webp|bmp|gif)/.test(type)) {
      progress('Распознаём текст на фото…');
      var items2 = []; await ocrItems(file, 1, items2);
      lines = DT.linesFromItems(items2); how = 'фото, распознавание текста';
    } else if (/^(heic|heif)$/.test(ext)) {
      throw new Error('Фото в формате HEIC браузер не открывает. Сделайте снимок экрана или сохраните фото как JPG.');
    } else if (/^(doc|rtf|pages|numbers|key|odt)$/.test(ext)) {
      throw new Error('Файл .' + ext + ' нужно сначала сохранить как PDF, Excel или Word (.docx), потом загрузить.');
    } else throw new Error('Не понимаем формат файла «' + name + '». Подойдут Excel, CSV, PDF, Word (.docx), текст или фото.');
    return { X: null, wb: DT.textWorkbook(lines, kind, year), how: how };
  }

  function fileDate(name) { var m = String(name).match(/(\d{1,2})[._-](\d{1,2})[._-](\d{4})/); return m ? m[3] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2) : ''; }

      : recs.slice(0, 40).map(function (r) { return P.kind === 'dep' ? [r.pickupDate ? dShort(r.pickupDate) : '—', r.pickup || '—', nice(r.name), r.flight + ' ' + r.time, r.vehicle] : [r.date ? dShort(r.date) : '—', r.self ? 'сам' : r.time, nice(r.name), r.flight, [r.terminal, r.vehicle].filter(Boolean).join(' · ')]; });

      sample.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>' +

  function applyPending() {
    var P = S.pend, T = tour(); if (!P) return;
    var d = (document.getElementById('pDate') || {}).value || P.date, all = !!(document.getElementById('pAll') || {}).checked;
    if (d) {

        P.res.pax.forEach(function (x) { if (all || !x.pickupDate) { x.pickupDate = d; x.date = x.date && !all ? x.date : d; var k = x.run.split('|'); k[1] = d; x.run = k.join('|'); } });
        P.res.slots.forEach(function (s) { if (all || !s.date) s.date = d; });
      } else P.res.arrivalList.forEach(function (a) { if (all || !a.date) a.date = d; });

      } else if (P.kind === 'kapak') {

        if (dates[0]) S.day = dates[0];

          else { var pw = DT.newPassword(taken); taken.push(pw); T.groups.push({ id: 'g' + Date.now().toString(36) + T.groups.length, name: ng.name, password: pw, guideId: '', extrasList: ng.extrasList, tourists: ng.tourists }); }

  /* Rebuild this page with new encrypted data and publish it as the next version. */
  function buildDocument(data) {
    var head = document.head.querySelector('style');
    var reset = head ? head.textContent : ':root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
    var keeps = Array.prototype.slice.call(document.querySelectorAll('body > [data-keep]'));
    var top = keeps.filter(function (e) { return e.tagName !== 'SCRIPT'; }).map(function (e) { return e.outerHTML; }).join('\n');
    var scripts = keeps.filter(function (e) { return e.tagName === 'SCRIPT'; }).map(function (e) { return e.outerHTML; }).join('\n');
    var json = JSON.stringify(data).replace(/</g, '\\u003c');
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' +
      top + '\n<div id="app"></div>\n<script type="application/json" id="dt-data">' + json + '<\/script>\n' + scripts + '</body></html>';
  }

  async function publish() {
    var bad = [], seen = {};
    S.admin.tours.forEach(function (t) { t.groups.forEach(function (g) { if (!g.password || g.password.length < 6) bad.push(g.name + ': код короче 6 символов'); if (seen[g.password]) bad.push('Код ' + g.password + ' повторяется'); seen[g.password] = 1; }); });
    guides().forEach(function (g) { if (!g.code || g.code.length < 6) bad.push('Гид ' + g.name + ': код короче 6 символов'); else if (seen[g.code]) bad.push('Код ' + g.code + ' повторяется'); seen[g.code] = 1; });
    if (bad.length) { S.msg = { bad: true, text: bad.join('. ') }; render(); return; }
    if (HOSTED) return publishHosted();
    var art = S.artifact;
    if (!art) { S.msg = { bad: true, text: 'Опубликовать может только владелец страницы, открыв её в claude.ai.' }; render(); return; }
    S.busy = true; S.msg = null; render();
    try {
      var pass = S.newAdminPass ? S.newAdminPass : S.adminPass;
      var data = await DT.buildData(S.admin, pass);
      await art.publish(buildDocument(data));
      S.adminPass = pass; S.newAdminPass = ''; S.dirty = false;
      S.msg = { text: 'Опубликовано. Туристы и гиды увидят изменения при следующем открытии.' };
    } catch (e) {
      var c = e && e.code;
      S.msg = { bad: true, text: c === 'conflict' ? 'Страницу только что обновили в другом окне. Откройте её заново и повторите.' : c === 'not_writer' || c === 'not_granted' ? 'Нет прав на публикацию. Откройте страницу в claude.ai под аккаунтом владельца.' : 'Не получилось опубликовать: ' + (e && e.message || e) };
    }
    S.busy = false; render();
  }

  async function publishHosted() {
    if (S.newAdminPass && S.newAdminPass.length < 10) { S.msg = { bad: true, text: 'Новый пароль администратора должен быть не короче 10 символов.' }; render(); return; }
    S.busy = true; S.msg = null; render();
    try {
      var pass = S.newAdminPass ? S.newAdminPass : S.adminPass;
      var data = await DT.buildData(S.admin, pass);
      var body = { data: data, writeKey: await DT.writeKey(S.adminPass) };
      if (S.newAdminPass) body.newWriteHash = await DT.sha256hex(await DT.writeKey(S.newAdminPass));
      var r = await fetch('/api/data', { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
      if (r.status === 403) throw new Error('Сервер не принял пароль администратора.');
      if (!r.ok) throw new Error('Сервер ответил ошибкой ' + r.status + '.');
      DATA = data; S.adminPass = pass; S.newAdminPass = ''; S.dirty = false;
      S.msg = { text: 'Опубликовано. Туристы и гиды увидят изменения при следующем открытии.' };
    } catch (e) { S.msg = { bad: true, text: 'Не получилось опубликовать: ' + (e.message || e) + ' Проверьте интернет и попробуйте ещё раз.' }; }
    S.busy = false; render();
  }

  function render() {
    var ae = document.activeElement, focusId = ae && (ae.id || (ae.dataset && (ae.dataset.a || ae.dataset.f))), selStart = null;

  app.addEventListener('submit', function (e) {
    e.preventDefault();

    if (e.target.id === 'addGuide') {
      var n = document.getElementById('ngName').value.trim(); if (!n) return;
      guides().push({ id: 'gd' + Date.now().toString(36), name: n, phone: document.getElementById('ngPhone').value.trim(), code: DT.newPassword(allCodes()) });
      S.dirty = true; render();
    }
  });

  async function adminLogin(pass) {
    S.busy = true; S.err = ''; render();
    await dataReady;
    var st = DATA.admin ? await DT.unlockAdmin(DATA, pass) : null;
    S.busy = false;
    if (!st) { S.err = 'Пароль не подошёл.'; render(); return; }
    st.tours = st.tours || []; st.departures = st.departures || { pax: [], slots: [] }; st.guides = st.guides || []; st.assign = st.assign || {};
    if (HOSTED) DT.writeKey(pass).then(startMarks);
    S.admin = st; S.adminPass = pass; S.view = 'admin'; S.atab = 'arr'; S.day = null; S.dirty = false; S.msg = null; S.tourIdx = 0; S.groupIdx = 0;
    render(); window.scrollTo(0, 0);
  }

  function has(v) { return v != null && v !== ''; }
  app.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    var d = b.dataset;
    if (d.tab) { S.tab = d.tab; render(); var tb = document.querySelector('.tabs'); if (tb && window.scrollY > tb.offsetTop) window.scrollTo(0, tb.offsetTop); return; }
    if (d.me) { S.meId = d.me; if (!S.preview) store('dt.me.' + S.payload.group.id, d.me); render(); return; }
    if (d.copy) {
      var txt = d.copy;
      try { navigator.clipboard.writeText(txt).then(function () { b.textContent = 'Скопировано'; }, function () { b.textContent = txt; }); } catch (er) { b.textContent = txt; }
      return;
    }
    if (d.gtab) { S.gtab = d.gtab; render(); return; }
    if (d.gday) { S.gday = d.gday; render(); return; }
    if (d.mk) { var mp = d.mk.split('|'), ms = mp.pop(), mpax = mp.pop(), mrun = mp.join('|'); setMark(mrun, mpax, markOf(mrun, mpax) === ms ? '' : ms); return; }
    if (d.atab) { S.atab = d.atab; S.msg = null; S.guest = null; render(); return; }
    if (d.fx) { S.open[d.fx] = !S.open[d.fx]; render(); return; }
    if (d.guest) { S.guest = d.guest; render(); var dw = document.querySelector('.drawer'); if (dw) dw.focus && dw.querySelector('button').focus(); return; }
    if (d.day) { S.day = d.day; render(); return; }
    if (d.goto) { var gp = d.goto.split('|'); S.atab = gp[0]; if (gp[1]) S.day = gp[1]; S.msg = null; render(); window.scrollTo(0, 0); return; }
    if (has(d.tour)) { S.tourIdx = +d.tour; S.groupIdx = 0; S.msg = null; render(); return; }
    if (has(d.grp)) { S.groupIdx = +d.grp; render(); return; }
    if (has(d.newcode)) { tour().groups[+d.newcode].password = DT.newPassword(allCodes()); S.dirty = true; render(); return; }
    if (has(d.gnew)) { guides()[+d.gnew].code = DT.newPassword(allCodes()); S.dirty = true; render(); return; }
    if (has(d.gprev)) { openGuide(DT.guidePayload(S.admin, guides()[+d.gprev]), true); return; }
    if (has(d.gdel)) {
      var g = guides()[+d.gdel];
      if (S.confirmDel !== g.id) { S.confirmDel = g.id; render(); return; }
      guides().splice(+d.gdel, 1); S.confirmDel = null;
      Object.keys(S.admin.assign || {}).forEach(function (k) { if (S.admin.assign[k].guideId === g.id) S.admin.assign[k].guideId = ''; });
      S.admin.tours.forEach(function (t) { t.groups.forEach(function (x) { if (x.guideId === g.id) x.guideId = ''; }); });
      S.dirty = true; render(); return;
    }
    if (has(d.preview)) { var T = tour(); openGroup(DT.groupPayload(S.admin, T, T.groups[+d.preview]), true); return; }
    if (has(d.delday)) { tour().route.splice(+d.delday, 1); S.dirty = true; render(); return; }
    switch (d.act) {
      case 'logout': stopMarks(); store('dt.code', null); S.payload = null; S.meId = null; S.view = 'login'; render(); break;
      case 'notMe': if (!S.preview) store('dt.me.' + S.payload.group.id, null); S.meId = null; S.tab = 'home'; render(); break;
      case 'adminLogin': S.err = ''; S.view = 'adminLogin'; render(); break;
      case 'toLogin': S.err = ''; S.view = 'login'; render(); break;
      case 'backAdmin': S.view = 'admin'; S.preview = false; render(); window.scrollTo(0, 0); break;
      case 'adminOut': stopMarks(); S.admin = null; S.adminPass = ''; S.view = 'login'; render(); break;
      case 'applyPending': applyPending(); break;
      case 'cancelPending': S.pend = null; S.msg = null; render(); break;
      case 'closeGuest': S.guest = null; render(); break;
      case 'publish': publish(); break;
      case 'kapakXlsx': kapakXlsx(); break;
      case 'copyKapak':
        var t2 = kapakText(DT.runs(S.admin));
        try { navigator.clipboard.writeText(t2).then(function () { b.textContent = 'Скопировано'; }, function () { b.textContent = 'Выделите текст выше и скопируйте'; }); } catch (er) { b.textContent = 'Выделите текст выше и скопируйте'; }
        break;
      case 'addDay': var T2 = tour(), last = T2.route[T2.route.length - 1]; T2.route.push({ date: last ? DT.addDays(last.date, 1) : T2.start, place: '', title: '', text: '' }); S.dirty = true; render(); break;
      case 'redate': var T3 = tour(); T3.route.forEach(function (x, i) { x.date = DT.addDays(T3.start, i); }); if (T3.route.length) T3.end = T3.route[T3.route.length - 1].date; S.dirty = true; render(); break;
      case 'archive': tour().archived = !tour().archived; S.dirty = true; render(); break;
      case 'newTour':
        var st = todayISO();
        S.admin.tours.push({ id: 'tour-' + Date.now().toString(36), title: 'Золотое кольцо Турции', subtitle: 'Анталья · Памуккале · Каппадокия', start: st, end: DT.addDays(st, 7), route: DT.defaultRoute(st), groups: [], arrivals: [] });
        S.tourIdx = S.admin.tours.length - 1; S.groupIdx = 0; S.dirty = true; render(); break;
    }
  });

  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'whoQ') { document.getElementById('whoList').innerHTML = whoItems(t.value); return; }
    if (t.id === 'gq') { S.gq = t.value; render(); return; }
    if (t.id === 'aq') { S.aq = t.value; render(); return; }
    if (t.id === 'newAdmin') { S.newAdminPass = t.value; if (t.value) markDirty(); return; }
    if (t.id === 'ngName' || t.id === 'ngPhone') return;
    if (t.dataset.a && t.tagName !== 'SELECT') { var p = t.dataset.a.split('|'), f = p.pop(); setAssign(p.join('|'), f, t.value); return; }
    if (t.dataset.f && t.tagName !== 'SELECT') setField(t.dataset.f, t.value);
  });
  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'upGroups' && t.files[0]) uploadFile(t.files[0], 'groups');
    else if (t.id === 'upDeps' && t.files[0]) uploadFile(t.files[0], 'dep');
    else if (t.id === 'upKapak' && t.files[0]) uploadFile(t.files[0], 'kapak');
    else if (t.id === 'pDate' && S.pend) S.pend.date = t.value;
    else if (t.id === 'pAll' && S.pend) S.pend.all = t.checked;
    else if (t.id === 'upTour') { S.tourIdx = +t.value; render(); }
    else if (t.id === 'fg') { S.fg = t.value; render(); }
    else if (t.id === 'fgr') { S.fgr = t.value; render(); }
    else if (t.dataset.a && t.tagName === 'SELECT') { var p = t.dataset.a.split('|'), f = p.pop(); setAssign(p.join('|'), f, t.value); render(); }
    else if (t.dataset.f) { setField(t.dataset.f, t.value); if (t.type === 'date' || t.tagName === 'SELECT') render(); }
  });

  app.addEventListener('focusout', function () { if (S.renderLater) { S.renderLater = false; setTimeout(function () { var ae = document.activeElement; if (!ae || !/INPUT|TEXTAREA|SELECT/.test(ae.tagName)) render(); else S.renderLater = true; }, 0); } });
  window.addEventListener('online', function () { flushMarks(); pullMarks(); });
  app.addEventListener('dragover', function (e) { var d = e.target.closest('.drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
  app.addEventListener('dragleave', function (e) { var d = e.target.closest('.drop'); if (d) d.classList.remove('over'); });
  app.addEventListener('drop', function (e) { var d = e.target.closest('.drop'); if (!d) return; e.preventDefault(); d.classList.remove('over'); var f = e.dataTransfer && e.dataTransfer.files[0]; if (f) uploadFile(f, d.dataset.kind); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.guest) { S.guest = null; render(); } });

  /* ---------- boot ---------- */
  dataReady.then(function () { S.loaded = true; if (S.view === 'login') render(); });
  function openPayload(p, preview, code) {
    if (p.role === 'guide') { openGuide(p, preview); if (!preview && code && HOSTED) DT.markKey(code).then(startMarks); }
    else openGroup(p, preview);
  }
  render();
  var saved = load('dt.code');
  if (saved) dataReady.then(function () { return DATA.groups ? DT.unlockGroup(DATA, saved) : null; }).then(function (p) { if (p && S.view === 'login') openPayload(p, false, saved); });
  window.addEventListener('hashchange', function () { if (S.view === 'login') render(); });
  if (window.claude && window.claude.use) {
    window.claude.use('user').then(function (u) {
      if (!u) return null;
      return Promise.all([u.canEdit(), u.isOwner()]).then(function (r) {
        S.canEdit = !!(r[0] || r[1]);
        if (S.canEdit && S.view === 'login') render();
      });
    }).catch(function () {});
    window.claude.use('artifact').then(function (a) { S.artifact = a || null; }).catch(function () {});
    window.claude.use('downloads').then(function (dl) { S.downloads = dl || null; }).catch(function () {});
  }
})();
</script>

</body>
</html>
